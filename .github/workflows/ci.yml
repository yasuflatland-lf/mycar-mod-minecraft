name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # main にはまだ package.json がないので、ある時だけ検査する
      - id: pkg
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.pkg.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.pkg.outputs.present == 'true'
        run: npm ci

      - if: steps.pkg.outputs.present == 'true'
        run: npm run typecheck

      - if: steps.pkg.outputs.present == 'true'
        run: npm test

      - if: steps.pkg.outputs.present == 'true'
        run: npm run build
