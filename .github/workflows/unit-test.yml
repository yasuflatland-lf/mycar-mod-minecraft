name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The main ruleset requires a status check named "check", so keep this job id.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Install Node and pnpm as pinned in mise.toml
      - uses: jdx/mise-action@v5

      - run: pnpm install --frozen-lockfile

      # Format and lint check (config files are checked even before source code lands)
      - run: pnpm exec biome ci

      # Code, comments, and docs must be in English (AGENTS.md)
      - run: pnpm run lint:lang

      # main has no source code yet, so only run these once tsconfig.json exists
      - id: src
        run: echo "present=$([ -f tsconfig.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.present == 'true'
        run: pnpm run typecheck

      - if: steps.src.outputs.present == 'true'
        run: pnpm run test:coverage

      - if: steps.src.outputs.present == 'true'
        run: pnpm run build

      - name: Upload coverage to Codecov
        if: always() && steps.src.outputs.present == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
