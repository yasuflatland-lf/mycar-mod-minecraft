allowBuilds:
  esbuild: true
# Vitest 5 matches testNamePattern against suite and test names joined with
# " > ", but the Stryker runner joins them with spaces, so no test ran for any
# mutant and every mutant survived (ADR 0046).
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
