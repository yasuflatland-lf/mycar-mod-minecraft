# Dev Bedrock Dedicated Server (ADR 0015). Start it with `pnpm server:up`,
# which sets BDS_TRANSPORT and BDS_UDP_PORTS.
name: yasuflatland-dev
services:
  bds:
    image: itzg/minecraft-bedrock-server
    container_name: yasuflatland-bds
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      LEVEL_NAME: "yasuflatland-dev"
      LEVEL_TYPE: "FLAT"
      GAMEMODE: "creative"
      ALLOW_CHEATS: "true"
      ALLOW_LIST: "false"
      TRANSPORT: "${BDS_TRANSPORT:-nethernet}"
      # NetherNet only: "<LAN IP>:19140-19155:19140-19155", so clients are told
      # the Mac's address and a published port instead of the container's.
      SERVER_UDP_PORTS: "${BDS_UDP_PORTS:-}"
      TEXTUREPACK_REQUIRED: "true"
      CONTENT_LOG_FILE_ENABLED: "true"
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
    ports:
      # nethernet: signaling, then one UDP port per client from the range
      - "19132:19132/tcp"
      - "19140-19155:19140-19155/udp"
      # raknet fallback: gameplay
      - "19132:19132/udp"
    volumes:
      - ./data:/data
      - ../packs/yasuflatland_bp:/data/behavior_packs/yasuflatland_bp:ro
      - ../packs/yasuflatland_test_bp:/data/behavior_packs/yasuflatland_test_bp:ro
      - ../packs/yasuflatland_rp:/data/resource_packs/yasuflatland_rp:ro
    network_mode: bridge
    stdin_open: true
    tty: true
