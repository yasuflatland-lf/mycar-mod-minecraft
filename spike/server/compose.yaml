# THROWAWAY spike server
services:
  bds:
    image: itzg/minecraft-bedrock-server
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      LEVEL_NAME: "spike"
      LEVEL_TYPE: "FLAT"
      GAMEMODE: "creative"
      ALLOW_CHEATS: "true"
      ALLOW_LIST: "false"
      TEXTUREPACK_REQUIRED: "true"
      CONTENT_LOG_FILE_ENABLED: "true"
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
    ports:
      - "19132:19132/udp"
    volumes:
      - ./data:/data
      - ../packs/spike_bp:/data/behavior_packs/spike_bp:ro
      - ../packs/spike_rp:/data/resource_packs/spike_rp:ro
    network_mode: bridge
    stdin_open: true
    tty: true
